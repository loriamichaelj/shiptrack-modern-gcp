# A regional external Application Load Balancer on the reserved regional address, with one HTTP listener. There
# is no HTTPS listener and no certificate (ADR-0031). The address and the Cloud Armor policy are created by
# terraform/modules/ui-ingress; this names them.
apiVersion: gateway.networking.k8s.io/v1
kind: Gateway
metadata:
  name: shiptrack-ui
  namespace: shiptrack
  labels:
    app.kubernetes.io/name: shiptrack
    app.kubernetes.io/component: gateway
spec:
  gatewayClassName: gke-l7-regional-external-managed
  listeners:
    - name: http
      protocol: HTTP
      port: 80
      allowedRoutes:
        namespaces:
          from: Same
  addresses:
    - type: NamedAddress
      value: shiptrack-ui
