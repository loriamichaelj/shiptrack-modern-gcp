# The Kubernetes service account of the db-init Job. Its IAM principal (the cluster root) may read the
# administrator's, the application's, and the migrator's database secrets, and nothing else. It holds no
# token: Workload Identity reaches Google through the metadata server.
apiVersion: v1
kind: ServiceAccount
metadata:
  name: shiptrack-db-init
  namespace: shiptrack
  labels:
    app.kubernetes.io/name: shiptrack
    app.kubernetes.io/component: db-init
automountServiceAccountToken: false
