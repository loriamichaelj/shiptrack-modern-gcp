name: destroy-cloud-sql

# Takes down Cloud SQL: the instance, its database, and its administrator (ADR-0027). THE DATA AND THE
# BACKUPS ARE DELETED. Two jobs, each in the `dev` environment and each needing the owner's approval:
# the first shows the addresses and actions a destroy would make, the second lowers the deletion
# protection, makes a fresh plan, and applies it. Both fail unless `confirm` is exactly `cloud-sql`.
# Remove the cluster first. The credentials secrets keep pointing at the old address until the next apply.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type cloud-sql to take the database down"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"
  # The group is one module of the data root.
  TARGETS: module.cloud_sql

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      - name: Plan the destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          UNPROTECT_VAR: deletion_protection
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          # shellcheck disable=SC2086 # TARGETS is a list of addresses separated by spaces
          .github/scripts/terraform-destroy.sh data plan cloud-sql $TARGETS

  destroy:
    needs: plan
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      # A fresh plan is made in this job and applied from the same job; no plan file is uploaded.
      - name: Destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          UNPROTECT_VAR: deletion_protection
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          # shellcheck disable=SC2086 # TARGETS is a list of addresses separated by spaces
          .github/scripts/terraform-destroy.sh data destroy cloud-sql $TARGETS
