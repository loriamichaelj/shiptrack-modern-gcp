name: destroy-all

# Takes down everything the destroy-* workflows can, in one run (ADR-0039): the UI load balancer, the add-ons,
# the cluster, and the whole data root (Cloud SQL, the network, Pub/Sub, the secrets, the bucket, monitoring, and
# the UI's subnet, address, and policy). EVERY DOCUMENT, EVERY SHIPMENT, AND THE BACKUPS ARE DELETED. The seed
# and finops roots are not touched: the state bucket, the service accounts, the trust, the budget, and the
# billing export stay. Two jobs, each in the `dev` environment and each needing the owner's approval: the first
# shows the addresses and actions of all three destroys, the second runs them in order. Both fail unless
# `confirm` is exactly `all`.
#
# The order matters: the Gateway, the load balancer, the add-ons, the network endpoint groups, the cluster, the
# data root. A run that stops part-way can be dispatched again: what is already gone is skipped, and the rest is
# planned afresh. The destroy-* workflows of single groups stay for taking down one group.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type all to take the whole stack down"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"
  CLUSTER: shiptrack

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$CONFIRM" == all ]] || { echo "::error::The confirmation does not match. Type all to take the whole stack down."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      # The add-ons root reads the cluster, so it can be planned only while the cluster exists.
      - name: Look for the cluster
        id: cluster
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          echo "::add-mask::$GCP_PROJECT_ID"
          if gcloud container clusters describe "$CLUSTER" --region "${GCP_REGION:-us-central1}" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "present=true" >>"$GITHUB_OUTPUT"
            echo "The cluster exists."
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "There is no cluster; the add-ons are skipped."
          fi
      - name: Plan the add-ons
        if: steps.cluster.outputs.present == 'true'
        env:
          CONFIRM: ${{ inputs.confirm }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: .github/scripts/terraform-destroy.sh addons plan all
      - name: Plan the cluster
        env:
          CONFIRM: ${{ inputs.confirm }}
          UNPROTECT_VAR: deletion_protection
          UNPROTECT_TARGETS: module.gke_autopilot
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: .github/scripts/terraform-destroy.sh cluster plan all
      - name: Plan the data root
        env:
          CONFIRM: ${{ inputs.confirm }}
          UNPROTECT_VAR: deletion_protection proof_of_delivery_protection
          UNPROTECT_TARGETS: module.cloud_sql module.proof_of_delivery_storage
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ALERT_EMAIL: ${{ secrets.GCP_ALERT_EMAIL }}
        run: .github/scripts/terraform-destroy.sh data plan all

  destroy:
    needs: plan
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    timeout-minutes: 150
    permissions:
      id-token: write
      contents: read
    steps:
      - name: Check the confirmation
        env:
          CONFIRM: ${{ inputs.confirm }}
        run: |
          [[ "$CONFIRM" == all ]] || { echo "::error::The confirmation does not match. Type all to take the whole stack down."; exit 1; }
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The Gateway is Kubernetes objects, so it is deleted as the deploy account. If the cluster went first, the
      # load balancer's resources could be left behind and block the network.
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # kubectl gets its token from gke-gcloud-auth-plugin, which the runner image does not include.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Look for the cluster
        id: cluster
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          echo "::add-mask::$GCP_PROJECT_ID"
          if gcloud container clusters describe "$CLUSTER" --region "${GCP_REGION:-us-central1}" --project "$GCP_PROJECT_ID" >/dev/null 2>&1; then
            echo "present=true" >>"$GITHUB_OUTPUT"
            echo "The cluster exists."
          else
            echo "present=false" >>"$GITHUB_OUTPUT"
            echo "There is no cluster; the Gateway and the add-ons are skipped."
          fi
      - name: Fetch credentials through the DNS endpoint
        if: steps.cluster.outputs.present == 'true'
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          gcloud container clusters get-credentials "$CLUSTER" --region "${GCP_REGION:-us-central1}" \
            --project "$GCP_PROJECT_ID" --dns-endpoint >/dev/null
      # Without the add-ons the deploy account has no rights in the namespace (its Role goes with it), and the
      # Gateway went with the namespace. The next step checks that the load balancer is gone either way.
      - name: Delete the Gateway
        if: steps.cluster.outputs.present == 'true'
        run: |
          if ! kubectl auth can-i delete gateways.gateway.networking.k8s.io --namespace shiptrack >/dev/null 2>&1; then
            echo "The deploy account has no rights in the shiptrack namespace, so the add-ons are gone; no Gateway to delete."
            exit 0
          fi
          kubectl delete -f deploy/gateway/route.yaml -f deploy/gateway/gateway.yaml -f deploy/gateway/health-check.yaml \
            -f deploy/gateway/backend-policy.yaml -f deploy/gateway/networkpolicy.yaml --ignore-not-found --wait=true --timeout=15m

      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      # Deleting the Gateway starts Google's removal of the load balancer. The subnet, the address, and the policy
      # cannot go while any part of it is left, and neither can the cluster without orphaning it, so wait for it.
      # The network endpoint groups are not in this list: the cluster's controller owns them and removes them only
      # after the api Service is deleted, which the add-ons destroy does. They are waited for after it.
      - name: Wait for the load balancer to go
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: >-
          .github/scripts/wait-for-gone.sh "The load balancer is"
          forwarding-rules target-http-proxies target-https-proxies url-maps backend-services

      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      # A fresh plan is made in each step and applied from the same step; no plan file is uploaded.
      - name: Destroy the add-ons
        if: steps.cluster.outputs.present == 'true'
        env:
          CONFIRM: ${{ inputs.confirm }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: .github/scripts/terraform-destroy.sh addons destroy all
      # The controller deletes the groups once their Service is gone. It runs in the cluster, so this comes before
      # the cluster is destroyed, and a group left behind would block the network.
      - name: Wait for the network endpoint groups to go
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
        run: .github/scripts/wait-for-gone.sh "The network endpoint groups are" network-endpoint-groups
      # With the cluster gone there is nothing left in this root, and its configuration reads outputs of the data
      # root, which a run that stopped part-way may already have emptied.
      - name: Destroy the cluster
        if: steps.cluster.outputs.present == 'true'
        env:
          CONFIRM: ${{ inputs.confirm }}
          UNPROTECT_VAR: deletion_protection
          UNPROTECT_TARGETS: module.gke_autopilot
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: .github/scripts/terraform-destroy.sh cluster destroy all
      # The protection is lowered on Cloud SQL and the bucket only. A second and third attempt wait for Google to
      # release the private services connection after Cloud SQL is gone.
      - name: Destroy the data root
        env:
          CONFIRM: ${{ inputs.confirm }}
          UNPROTECT_VAR: deletion_protection proof_of_delivery_protection
          UNPROTECT_TARGETS: module.cloud_sql module.proof_of_delivery_storage
          DESTROY_ATTEMPTS: "3"
          RETRY_WAIT_SECONDS: "300"
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_ALERT_EMAIL: ${{ secrets.GCP_ALERT_EMAIL }}
        run: .github/scripts/terraform-destroy.sh data destroy all
