name: ops-check-cluster

# Proves the cluster can be reached through its DNS endpoint by the deploy account, which is the Done
# criterion of the cluster root (design section 16), and that the deploy account may list pods in the
# namespace and nowhere else, which is the Done criterion of the add-ons root. It fetches credentials on
# the runner, asks the control plane for its version and readiness, and asks what the account may do.
# It changes nothing. Before the add-ons root is applied the namespace and its role do not exist, so the
# permission answers are reported and do not fail the run. Nothing is printed that names the cluster's
# address.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  check:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # kubectl gets its token from gke-gcloud-auth-plugin. The runner image has gcloud but not the plugin,
      # and its package source does not carry it, so Google's setup action installs it.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Reach the control plane through the DNS endpoint
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          echo "::add-mask::$GCP_PROJECT_ID"
          gcloud container clusters get-credentials shiptrack --region "${GCP_REGION:-us-central1}" \
            --project "$GCP_PROJECT_ID" --dns-endpoint >/dev/null
          kubectl get --raw /version | jq -r '"control plane " + .gitVersion'
          kubectl get --raw /readyz
          echo
          echo "The cluster answers through its DNS endpoint."
          # kubectl auth can-i exits 1 for "no", which is an answer here and not a failure.
          allowed() { kubectl auth can-i "$@" 2>/dev/null || true; }
          echo "list pods in shiptrack:       $(allowed list pods --namespace shiptrack)"
          echo "create deployments in shiptrack: $(allowed create deployments.apps --namespace shiptrack)"
          echo "list pods in kube-system:     $(allowed list pods --namespace kube-system)"
          echo "list pods in all namespaces:  $(allowed list pods --all-namespaces)"
          echo "list nodes:                   $(allowed list nodes)"
