name: ops-restart

# Restarts every Deployment in the application's namespace, one rollout, and waits until they are ready and the
# API answers a request that reads the database (runbook docs/runbooks/secret-rotation.md). A pod keeps the
# database credentials it fetched when it started; a restart makes every pod fetch the current ones. It
# changes no configuration and no image. The `dev` environment requires the owner's approval.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: deploy-dev
  cancel-in-progress: false

jobs:
  restart:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_DEPLOY_SERVICE_ACCOUNT }}
      # kubectl gets its token from gke-gcloud-auth-plugin, which the runner image does not include.
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
        with:
          install_components: gke-gcloud-auth-plugin
      - name: Fetch credentials through the DNS endpoint
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          echo "::add-mask::$GCP_PROJECT_ID"
          gcloud container clusters get-credentials shiptrack --region "${GCP_REGION:-us-central1}" \
            --project "$GCP_PROJECT_ID" --dns-endpoint >/dev/null
      - name: Restart every Deployment
        run: |
          kubectl -n shiptrack rollout restart deployment
          for deployment in $(kubectl -n shiptrack get deployments -o name); do
            kubectl -n shiptrack rollout status "$deployment" --timeout=600s
          done
      - name: The API answers a request that reads the database
        run: |
          kubectl -n shiptrack port-forward svc/shiptrack-api 18000:8000 >/dev/null 2>&1 &
          trap 'kill $! 2>/dev/null || true' EXIT
          for attempt in $(seq 1 30); do
            status=$(curl -s -o /dev/null -m 5 -w '%{http_code}' "http://localhost:18000/api/v1/shipments?limit=1" || true)
            echo "attempt ${attempt}: HTTP ${status:-none}"
            [[ "$status" == 200 ]] && exit 0
            sleep 10
          done
          echo "::error::the API still does not answer a request that reads the database"
          exit 1
