name: ops-check-state

# Lists the saved versions of each root's Terraform state (runbook docs/runbooks/state-recovery.md). It
# changes nothing. It runs as the read-only plan account in the `ci` environment, and prints each root's
# object name, version number, and time, never a bucket name or any state content.

on:
  workflow_dispatch:

permissions:
  contents: read

jobs:
  state:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: ci
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_PLAN_SERVICE_ACCOUNT }}
      - uses: google-github-actions/setup-gcloud@aa5489c8933f4cc7a4f7d45035b3b1440c9c10db # v3.0.1
      - name: List the state versions
        env:
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
        run: |
          set -euo pipefail
          echo "::add-mask::$GCP_PROJECT_NUMBER"
          bucket="shiptrack-tfstate-${GCP_PROJECT_NUMBER}"
          echo "::add-mask::$bucket"
          # Only the object name, version, and times are kept from each listing entry; the bucket is not printed.
          versions=$(gcloud storage ls -a --json "gs://${bucket}/gcp/**" \
            | jq -r '[.[] | .metadata | select(.name | endswith(".tfstate")) | {name, generation, timeCreated, live: (.timeDeleted == null)}]
                     | group_by(.name) | map(sort_by(.timeCreated) | reverse)[][]
                     | "| \(.name) | \(.generation) | \(.timeCreated[0:19] | sub("T"; " ")) | \(if .live then "live" else "older" end) |"')
          [[ -n "$versions" ]] || { echo "::error::no state object was listed"; exit 1; }
          {
            echo "## Terraform state versions"
            echo
            echo "| Object | Version | Saved (UTC) | State |"
            echo "|---|---|---|---|"
            echo "$versions"
          } | tee -a "$GITHUB_STEP_SUMMARY"
