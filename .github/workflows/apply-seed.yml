name: apply-seed

# Applies terraform/seed (state bucket, APIs, service accounts, GitHub trust, and permissions)
# using the manually created seed service account. Both jobs run in the `seed` environment,
# which requires a reviewer: approve the first to see the plan summary, then approve the second to
# apply it. See terraform/seed/README.md for the one-time setup.

on:
  workflow_dispatch:

permissions:
  contents: read

concurrency:
  group: seed
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: seed
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SEED_SERVICE_ACCOUNT }}
      - name: Plan
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_github_repository_id: ${{ github.repository_id }}
        run: terraform/seed/scripts/ci.sh plan

  apply:
    needs: plan
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: seed
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_SEED_SERVICE_ACCOUNT }}
      # A fresh plan is made in this job and applied from the same job; no plan file is uploaded.
      - name: Apply
        env:
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          TF_VAR_github_org: ${{ github.repository_owner }}
          TF_VAR_github_owner_id: ${{ github.repository_owner_id }}
          TF_VAR_github_repo: ${{ github.event.repository.name }}
          TF_VAR_github_repository_id: ${{ github.repository_id }}
        run: terraform/seed/scripts/ci.sh apply
