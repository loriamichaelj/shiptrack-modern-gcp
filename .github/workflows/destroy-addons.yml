name: destroy-addons

# Takes down the add-ons: the `shiptrack` namespace and the deploy account's role in it (ADR-0027).
# EVERYTHING RUNNING IN THE NAMESPACE IS DELETED with it, which is the release. Two jobs, each in the
# `dev` environment and each needing the owner's approval: the first shows the addresses and actions a
# destroy would make, the second makes a fresh plan and applies it. Both fail unless `confirm` is exactly
# `addons`. This is the first group to remove, before the cluster.

on:
  workflow_dispatch:
    inputs:
      confirm:
        description: "Type addons to take the add-ons down"
        required: true
        type: string

permissions:
  contents: read

concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"
  # The group is the whole addons root: the namespace, the role, and the binding.
  TARGETS: >-
    kubernetes_role_binding_v1.deployer
    kubernetes_role_v1.deployer
    kubernetes_namespace_v1.shiptrack

jobs:
  plan:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      - name: Plan the destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          # shellcheck disable=SC2086 # TARGETS is a list of addresses separated by spaces
          .github/scripts/terraform-destroy.sh addons plan addons $TARGETS

  destroy:
    needs: plan
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      # A fresh plan is made in this job and applied from the same job; no plan file is uploaded.
      - name: Destroy
        env:
          CONFIRM: ${{ inputs.confirm }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
        run: |
          # shellcheck disable=SC2086 # TARGETS is a list of addresses separated by spaces
          .github/scripts/terraform-destroy.sh addons destroy addons $TARGETS
