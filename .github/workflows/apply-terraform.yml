name: apply-terraform

# Applies one Terraform root as the apply account, in the `dev` environment: the owner approves the
# run before it starts. The pull request's plan comment is what to read before approving. The run
# makes a fresh plan and applies that plan from the same job; no plan file is uploaded.
# Apply the roots in order: data, then cluster, then addons.

on:
  workflow_dispatch:
    inputs:
      root:
        description: "Root to apply"
        required: true
        type: choice
        options:
          - data
          - finops

permissions:
  contents: read

# One state lock at a time across apply and destroy runs.
concurrency:
  group: terraform
  cancel-in-progress: false

env:
  TF_VERSION: "1.16.4"

jobs:
  apply:
    if: github.ref == 'refs/heads/dev'
    runs-on: ubuntu-24.04
    environment: dev
    permissions:
      id-token: write
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: hashicorp/setup-terraform@dfe3c3f87815947d99a8997f908cb6525fc44e9e # v4.0.1
        with:
          terraform_version: ${{ env.TF_VERSION }}
          terraform_wrapper: false
      - uses: google-github-actions/auth@7c6bc770dae815cd3e89ee6cdf493a5fab2cc093 # v3.0.0
        with:
          workload_identity_provider: ${{ secrets.GCP_WORKLOAD_IDENTITY_PROVIDER }}
          service_account: ${{ secrets.GCP_APPLY_SERVICE_ACCOUNT }}
      - name: Apply
        env:
          ROOT: ${{ inputs.root }}
          GCP_PROJECT_ID: ${{ secrets.GCP_PROJECT_ID }}
          GCP_PROJECT_NUMBER: ${{ secrets.GCP_PROJECT_NUMBER }}
          GCP_REGION: ${{ vars.GCP_REGION }}
          GCP_BILLING_ACCOUNT_ID: ${{ secrets.GCP_BILLING_ACCOUNT_ID }}
          GCP_ALERT_EMAIL: ${{ secrets.GCP_ALERT_EMAIL }}
        run: .github/scripts/terraform-ci.sh "$ROOT" apply
